name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-python313:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q
      - run: python -m ruff check --no-cache src tests scripts
      - run: python -m ruff format --check --no-cache src tests scripts
      - run: python -m pip check
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --disable-pip --no-deps -r requirements-lock.txt
